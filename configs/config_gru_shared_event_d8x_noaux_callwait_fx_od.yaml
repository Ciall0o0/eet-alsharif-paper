aux_prediction:
  dest_head_on: false
  dropout: 0.1
  enabled: true
  event_head_on: true
  hidden: 128
  lambda: 0.01
  mode: zone
  num_classes: 3
  num_layers: 2
  pred_lr: 0.001
  replay_capacity: 4096
  reward_change_on: false
  reward_pred_lambda: 0
  value_replay_lambda: 0
data:
  datasets_dir: datasets
  random_seed: 42
  test_ratio: 0.15
  train_ratio: 0.7
  val_ratio: 0.15
env:
  accel_decel_time: 1.0
  alighting_time_per_pax: 0.6
  assignment_correct: 0.0
  assignment_lb_lambda: 15.0
  assignment_lb_weight: 0.05
  assignment_reward: none
  boarding_time_per_pax: 0.8
  deliver_reward_call: 2.0
  door_close_time: 3.0
  door_open_time: 3.0
  dwell_time: 3.0
  floor_travel_time: 2.0
  idle_timeout: 60.0
  long_wait_threshold: 60.0
  max_dt: 30.0
  max_load_kg: 900
  max_total_time: 43200.0
  num_elevators: 3
  num_floors: 10
  obs_car_calls_dist: true
  obs_eta: true
  passenger_weight_mode: normal
  response_reward: 2.0
  response_reward_base: 5.0
  response_reward_k: 0.02
  reward_metric: pax
  reward_mode: callwait
  reward_scale: 0.01
  wait_cap_per_call: 50.0
  zone_mode: height
model:
  action_dim: 3
  activation: relu
  actor_dropout: 0.0
  actor_hidden: 64
  critic_dropout: 0.0
  critic_hidden: 64
  gru_dropout: 0.1
  gru_hidden: 256
  gru_layers: 2
  state_dim: 128
  type: gru_shared
  use_layer_norm: true
ppo:
  batch_size: 8192
  burn_in_steps: 8
  clip_epsilon: 0.2
  compile_policy: false
  entropy_coef_end: 1.0e-05
  entropy_coef_start: 0.0005
  entropy_floor: 0.0
  gae_lambda: 0.95
  gamma: 0.99
  kl_early_stop: false
  kl_target: 0.01
  learning_rate: 0.0001
  max_grad_norm: 0.5
  normalize_advantage: true
  normalize_rewards: false
  num_envs: 8
  ppo_epochs: 10
  rollout_steps: 96000
  seq_len: 32
  use_amp: true
  value_loss_coef: 1.0
  weight_decay: 0.0001
reward:
  assignment_correct: 0.0
  assignment_direction_align: 0.02
  assignment_estimated_wait: -0.01
  assignment_load_balance: -0.03
  assignment_proximity: -0.05
  clip_range: 5.0
  empty_distance_per_floor: -0.1
  energy_per_start_stop: -0.05
  idle_penalty_per_sec: -0.005
  normalize: false
  passenger_delivered: 2.0
  r_abandon: -1.0
  wait_time_per_sec: -0.05
traffic:
  arrival_rates:
    down_peak: 6.469
    interfloor: 3.45
    lunch_peak: 4.313
    off_peak: 1.294
    up_peak: 6.469
  config_file: config/traffic_scenarios.yaml
  enabled: true
  episode_duration_seconds: 900
  max_events_per_episode: 12000
  traffic_seed: 42
  val_max_events: 12000
  val_n_per_mode: 3
training:
  augment: true
  augment_seed: 42
  early_stop_patience: 8
  eval_every: 5
  num_envs: 8
  plot_freq: 50
  resume_checkpoint: ''
  save_dir: checkpoints/zone8x
  total_epochs: 60
  val_freq: 10
  val_per_mode: 5
  warmup_epochs: 0
  warmup_ratio: 0.1
