# 8x-density variant of the main 122-dim zone-aux recipe.
# Training rates = eval 8x pax-aligned rates (single-call decomposition:
# call rate == pax rate). x2.0 cfg rates {6.0,6.0,4.0,3.2,1.2} x4 = 8x.
data:
  datasets_dir: datasets
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
env:
  num_elevators: 3
  num_floors: 10
  zone_mode: height
  max_load_kg: 900
  floor_travel_time: 2.0
  accel_decel_time: 1.0
  door_open_time: 3.0
  door_close_time: 3.0
  dwell_time: 3.0
  boarding_time_per_pax: 0.8
  alighting_time_per_pax: 0.6
  idle_timeout: 60.0
  long_wait_threshold: 60.0
  max_total_time: 43200.0
  max_dt: 30.0
  obs_car_calls_dist: true
  obs_eta: true
  reward_scale: 0.01
model:
  state_dim: 128
  type: gru_shared
  gru_hidden: 256
  gru_layers: 2
  gru_dropout: 0.1
  actor_hidden: 64
  critic_hidden: 64
  action_dim: 3
  use_layer_norm: true
  activation: relu
  actor_dropout: 0.0
  critic_dropout: 0.0
ppo:
  learning_rate: 0.00003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_loss_coef: 1.0
  entropy_coef_start: 0.00001
  entropy_coef_end: 0.00001
  entropy_floor: 0.0
  max_grad_norm: 0.5
  ppo_epochs: 10
  batch_size: 8192
  rollout_steps: 32768
  seq_len: 32
  burn_in_steps: 8
  weight_decay: 0.0001
  compile_policy: false
  use_amp: true
  kl_early_stop: false
  kl_target: 0.01
  normalize_advantage: true
  normalize_rewards: false
  num_envs: 8
training:
  total_epochs: 60
  eval_every: 5
  early_stop_patience: 8
  save_dir: checkpoints/zone8x
  num_envs: 8
  augment: true
  augment_seed: 42
  warmup_epochs: 0
  warmup_ratio: 0.1
  resume_checkpoint: ''
  plot_freq: 50
reward:
  passenger_delivered: 2.0
  wait_time_per_sec: -0.05
  empty_distance_per_floor: -0.1
  energy_per_start_stop: -0.05
  idle_penalty_per_sec: -0.005
  assignment_proximity: -0.05
  assignment_direction_align: 0.02
  assignment_load_balance: -0.03
  assignment_estimated_wait: -0.01
  assignment_correct: 0.3
  r_abandon: -1.0
  normalize: false
  clip_range: 5.0
traffic:
  enabled: true
  config_file: config/traffic_scenarios.yaml
  traffic_seed: 42
  episode_duration_seconds: 900
  max_events_per_episode: 12000
  val_n_per_mode: 3
  arrival_rates:
    up_peak: 6.469
    down_peak: 6.469
    lunch_peak: 4.313
    interfloor: 3.45
    off_peak: 1.294
  val_max_events: 12000
aux_prediction:
  enabled: true
  mode: zone
  lambda: 0.3
  hidden: 128
  num_layers: 2
  dropout: 0.1
  num_classes: 3
  pred_lr: 0.001
  reward_pred_lambda: 0.01
  value_replay_lambda: 0.005
  replay_capacity: 4096
  dest_head_on: false
  reward_change_on: false
  event_head_on: true
